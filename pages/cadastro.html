<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Prazo Certo</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main class="auth-layout" aria-label="Criação de conta">
    <aside class="auth-brand-panel" aria-label="Apresentação da marca">
      <div class="auth-brand-content">
        <a class="brand brand--light" href="../index.html" aria-label="Prazo Certo — início">
          <img src="../img/logo-branco.svg" width="36" height="36" alt="">
          <span>Prazo Certo</span>
        </a>
        <h1>Seu semestre, em ordem.</h1>
        <p>Provas, trabalhos e prazos em uma agenda só sua.</p>
        <ol class="auth-timeline" aria-label="Exemplo de próximos prazos">
          <li>Prova de Física<time datetime="2026-11-18">18/11</time></li>
          <li>Trabalho de História<time datetime="2026-11-21">21/11</time></li>
          <li>Prova de Português<time datetime="2026-11-25">25/11</time></li>
        </ol>
      </div>
    </aside>

    <section class="auth-main" aria-label="Cadastro de conta">
      <div class="auth-card">
        <h2>Criar conta</h2>
        <p>Organize suas provas e trabalhos em um só lugar.</p>

        <form id="form-cadastro" class="form-stack" action="#" method="post">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" autocomplete="name" maxlength="100" required>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>
            <p class="field-help">Use pelo menos 8 caracteres.</p>
          </div>
          <div class="field">
            <label for="confirmar-senha">Confirmar senha</label>
            <input id="confirmar-senha" name="confirmar_senha" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div id="erro-cadastro" class="form-error" role="alert" tabindex="-1" hidden></div>
          <button id="btn-cadastrar" class="auth-submit" type="submit">Criar conta</button>
        </form>

        <nav class="auth-links auth-links--spaced" aria-label="Links da conta">
          <a id="link-login" href="login.html">Já tenho conta</a>
        </nav>
      </div>
    </section>
  </main>
  <noscript>Ative o JavaScript para usar a agenda.</noscript>
</body>
</html>
